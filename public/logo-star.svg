  <path d="M 32 46 C 44 42 62 44 76 54 C 64 54 48 56 40 64 Z" fill="#93C5FD" opacity="0.6" />

  <!-- Open Book Emblem -->
  <!-- Book spine shadow -->
  <path d="M 60 76 L 60 106 L 56 104 L 56 78 Z" fill="#061B3A" opacity="0.6"/>

  <!-- Left Pages Stack -->
  <path d="M 60 84 C 50 81 32 80 18 87 C 22 96 28 107 60 105 Z" fill="#0A3268" />
  <path d="M 60 80 C 50 77 34 76 22 83 C 25 90 32 101 60 100 Z" fill="url(#bookPageGrad)" stroke="#1769E8" stroke-width="1.5" />
  <path d="M 58 83 C 50 80 38 79 28 84" stroke="#0E3D7D" stroke-width="1" stroke-linecap="round" />
  <path d="M 58 87 C 50 84 38 83 29 88" stroke="#0E3D7D" stroke-width="1" stroke-linecap="round" />
  <path d="M 58 91 C 50 88 39 87 31 92" stroke="#0E3D7D" stroke-width="1" stroke-linecap="round" />

  <!-- Right Pages Stack -->
  <path d="M 60 84 C 70 81 88 80 102 87 C 98 96 92 107 60 105 Z" fill="#0A3268" />
  <path d="M 60 80 C 70 77 86 76 98 83 C 95 90 88 101 60 100 Z" fill="url(#bookPageGrad)" stroke="#1769E8" stroke-width="1.5" />
  <path d="M 62 83 C 70 80 82 79 92 84" stroke="#0E3D7D" stroke-width="1" stroke-linecap="round" />
  <path d="M 62 87 C 70 84 82 83 91 88" stroke="#0E3D7D" stroke-width="1" stroke-linecap="round" />
  <path d="M 62 91 C 70 88 81 87 89 92" stroke="#0E3D7D" stroke-width="1" stroke-linecap="round" />

  <!-- Gold Book Center Trim / Bookmark -->
