  </defs>

  <!-- Accent Small Gold Star (top right) -->
  <path d="M 88 18 Q 88 28 98 28 Q 88 28 88 38 Q 88 28 78 28 Q 88 28 88 18 Z" fill="url(#goldGrad)" filter="drop-shadow(0 2px 4px rgba(245,158,11,0.4))" />

  <!-- Main 4-Point North Star -->
